<svg width="480" height="140" viewBox="0 0 480 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cz-red-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A54" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>
    <linearGradient id="cz-silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="cz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Emblem Container -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Rim -->
    <path d="M60 5 L108 24 C108 72 82 102 60 115 C38 102 12 72 12 24 Z" 
          fill="#090D16" stroke="url(#cz-silver-grad)" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Inner Accent Arc (Red) -->
    <path d="M60 14 L98 30 C98 68 76 94 60 104 C44 94 22 68 22 30 Z" 
          fill="none" stroke="url(#cz-red-grad)" stroke-width="2" opacity="0.9" />
    
    <!-- Stylized Aerodynamic C -->
    <path d="M78 44 C72 35 62 32 52 34 C39 37 31 49 32 64 C33 78 43 89 57 88 C67 87 75 80 79 73" 
          stroke="url(#cz-silver-grad)" stroke-width="7" stroke-linecap="round" fill="none" />
    <!-- Inner Wing (Red Racing Streak) -->
    <path d="M50 54 C58 52 74 54 88 46 C79 56 68 62 50 63 Z" 
          fill="url(#cz-red-grad)" filter="url(#cz-glow)" />
    <path d="M52 65 C62 64 78 68 86 60 C78 69 66 73 52 72 Z" 
          fill="url(#cz-red-grad)" opacity="0.85" />
  </g>

  <!-- Typography: CARZONE SARL -->
  <g transform="translate(142, 22)">
    <!-- Main Brand Name -->
    <text x="0" y="48" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="46" font-weight="900" letter-spacing="3" fill="url(#cz-silver-grad)">
      CAR<tspan fill="url(#cz-red-grad)">ZONE</tspan>
    </text>
    
    <!-- Horizontal Speed / Accent Divider -->
    <line x1="2" y1="60" x2="280" y2="60" stroke="url(#cz-red-grad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="288" cy="60" r="2.5" fill="#E11D48" />

    <!-- Subtitle: SARL • COTONOU BENIN -->
    <text x="3" y="82" font-family="'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="700" letter-spacing="5" fill="#94A3B8">
      SARL <tspan fill="#E11D48">&#8226;</tspan> COTONOU B&#201;NIN
    </text>
    <text x="3" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="10.5" font-weight="600" letter-spacing="2" fill="#64748B">
      SHOWROOM AUTOMOBILE &amp; SAV MULTIMARQUES
    </text>
  </g>
</svg>