<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F19" />
    <title>CARZONE - Hors ligne</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0b0f19;
        color: #f8fafc;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        max-width: 420px;
        padding: 28px;
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 18px;
        background: #141923;
        text-align: center;
      }
      h1 { margin: 0 0 12px; font-size: 1.3rem; }
      p { margin: 0 0 22px; color: #cbd5e1; line-height: 1.55; }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        background: #d4af37;
        color: #0b0f19;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CARZONE est hors ligne</h1>
      <p>Vérifiez votre connexion internet, puis réessayez. La connexion et les données de l'application nécessitent un réseau.</p>
      <button type="button" onclick="window.location.reload()">Réessayer</button>
    </main>
  </body>
</html>
