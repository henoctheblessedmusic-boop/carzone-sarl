<svg width="480" height="130" viewBox="0 0 480 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="cz-gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="cz-gold-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="cz-gold-motto" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <filter id="cz-glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circular Text Paths for the Official Seal -->
    <!-- Center of seal is at (65, 65), radius = 45 -->
    <path id="top-arc" d="M 23,65 A 42,42 0 1,1 107,65" fill="none" />
    <path id="bottom-arc" d="M 107,65 A 42,42 0 0,1 23,65" fill="none" />
  </defs>

  <!-- ==================== OFFICIAL CIRCULAR SEAL (EMBLEM) ==================== -->
  <g id="official-seal">
    <!-- Outer Dark Background Circle -->
    <circle cx="65" cy="65" r="58" fill="#0A0D14" stroke="url(#cz-gold-grad)" stroke-width="2.5" />
    
    <!-- Outer Decorative Thin Gold Ring -->
    <circle cx="65" cy="65" r="54" fill="none" stroke="url(#cz-gold-light)" stroke-width="0.8" opacity="0.7" />
    
    <!-- Inner Boundary Ring for Text Track -->
    <circle cx="65" cy="65" r="34" fill="#0F1420" stroke="url(#cz-gold-grad)" stroke-width="1.8" />
    <circle cx="65" cy="65" r="32" fill="none" stroke="#F59E0B" stroke-width="0.5" opacity="0.6" />

    <!-- Arched Text Top: CONCESSION DE VEHICULES MULTI MARQUES -->
    <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="5.2" font-weight="800" fill="url(#cz-gold-light)" letter-spacing="0.8">
      <textPath href="#top-arc" startOffset="50%" text-anchor="middle">
        • CONCESSION DE VEHICULES MULTI MARQUES •
      </textPath>
    </text>

    <!-- Arched Text Bottom: +229 01 92 61 61 61 -->
    <text font-family="'Montserrat', 'Arial Black', sans-serif" font-size="5.8" font-weight="800" fill="url(#cz-gold-light)" letter-spacing="1.2">
      <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">
        • +229 01 92 61 61 61 •
      </textPath>
    </text>

    <!-- Center Icon: Stylized Winged Steering Wheel with 'Z' monogram -->
    <g id="center-monogram" transform="translate(65, 59)">
      <!-- Left Aerodynamic Wing / Headlight Sweep -->
      <path d="M -16,-3 C -23,-7 -26,-1 -25,5 C -23,3 -19,1 -15,2 Z" fill="url(#cz-gold-grad)" />
      <path d="M -18,-9 C -27,-8 -28,1 -22,8 C -24,4 -21,0 -16,-4 Z" fill="url(#cz-gold-light)" opacity="0.8" />

      <!-- Right Aerodynamic Wing / Headlight Sweep -->
      <path d="M 16,-3 C 23,-7 26,-1 25,5 C 23,3 19,1 15,2 Z" fill="url(#cz-gold-grad)" />
      <path d="M 18,-9 C 27,-8 28,1 22,8 C 24,4 21,0 16,-4 Z" fill="url(#cz-gold-light)" opacity="0.8" />

      <!-- Center Outer Ring -->
      <circle cx="0" cy="0" r="14" fill="#0A0D14" stroke="url(#cz-gold-grad)" stroke-width="2" />
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#cz-gold-light)" stroke-width="0.8" opacity="0.8" />

      <!-- Stylized Z Monogram -->
      <path d="M -7,-6.5 L 7,-6.5 L 7,-4 L -2.5,4 L 7,4 L 7,6.5 L -7,6.5 L -7,4 L 2.5,-4 L -7,-4 Z" 
            fill="url(#cz-gold-grad)" filter="url(#cz-glow-gold)" />

      <!-- Center Text: — CARZONE — -->
      <text x="0" y="19" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="4.5" font-weight="900" fill="url(#cz-gold-light)" text-anchor="middle" letter-spacing="1">
        — CARZONE —
      </text>
    </g>
  </g>

  <!-- ==================== BRAND NAME & OFFICIAL MOTTO ==================== -->
  <g transform="translate(140, 0)">
    <!-- Brand Title: CARZONE -->
    <g transform="translate(0, 42)">
      <text x="0" y="0" font-family="'Montserrat', 'Impact', sans-serif" font-size="42" font-weight="900" letter-spacing="4" fill="url(#cz-gold-light)">
        CAR<tspan fill="#FFFFFF">ZONE</tspan>
      </text>
      <!-- Sub-badge: CONCESSION MULTI-MARQUES -->
      <rect x="235" y="-30" width="95" height="16" rx="4" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1" />
      <text x="282.5" y="-19" font-family="'Montserrat', sans-serif" font-size="7.5" font-weight="800" fill="#FCD34D" text-anchor="middle" letter-spacing="0.8">
        MULTI-MARQUES
      </text>
    </g>

    <!-- OFFICIAL MOTTO: DRIVE YOUR DREAM (Varsity / Collegiate Bold with Outline) -->
    <g transform="translate(2, 82)">
      <!-- Outline / Shadow Layer -->
      <text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-size="28" font-weight="900" letter-spacing="3" 
            fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="miter">
        DRIVE YOUR DREAM
      </text>
      <!-- Foreground Gold Layer -->
      <text x="0" y="0" font-family="'Arial Black', 'Impact', sans-serif" font-size="28" font-weight="900" letter-spacing="3" 
            fill="url(#cz-gold-motto)">
        DRIVE YOUR DREAM
      </text>
    </g>

    <!-- Official Contacts & Information Footer Bar -->
    <g transform="translate(2, 108)">
      <line x1="0" y1="0" x2="330" y2="0" stroke="url(#cz-gold-grad)" stroke-width="1.5" opacity="0.8" />
      <circle cx="334" cy="0" r="2" fill="#F59E0B" />
      
      <text x="0" y="14" font-family="'Montserrat', system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#CBD5E1">
        COTONOU B&#201;NIN <tspan fill="#F59E0B">•</tspan> TEL : <tspan fill="#FCD34D" font-weight="800">+229 01 92 61 61 61</tspan>
      </text>
    </g>
  </g>
</svg>
